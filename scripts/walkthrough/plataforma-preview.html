<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Plataforma preview</title>
    <style>
      body { margin: 0; font-family: Georgia, serif; background: #f4f7f4; color: #2d3f33; }
      .wrap { padding: 24px; max-width: 1100px; margin: 0 auto; }
      h2 { color: #2d6f63; font-weight: 400; font-size: 28px; margin: 0; }
      .muted { color: #6b7c70; font-size: 14px; }
      .grid3 { display: grid; gap: 12px; grid-template-columns: repeat(3, 1fr); margin-top: 16px; }
      .grid3.mobile { grid-template-columns: 1fr; }
      .card { background: #fff; border-radius: 6px; padding: 16px; box-shadow: 0 18px 50px rgba(61, 82, 64, 0.08); }
      .num { font-size: 32px; color: #2d6f63; font-variant-numeric: tabular-nums; margin-top: 8px; }
      .funnel { margin-top: 16px; }
      .row { margin-top: 10px; }
      .row-head { display: flex; justify-content: space-between; font-size: 14px; }
      .track { height: 8px; background: #f4f7f4; border-radius: 999px; margin-top: 4px; overflow: hidden; }
      .fill { height: 100%; background: #2d6f63; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>Ativação e trial</h2>
      <p class="muted">Eventos sem conteúdo clínico (só conta, marco e horário).</p>
      <div class="grid3" id="metrics">
        <div class="card"><p class="muted">Conversão trial → paga</p><p class="num">12,5%</p></div>
        <div class="card"><p class="muted">Mediana até 1ª sessão</p><p class="num">4,0 d</p></div>
        <div class="card"><p class="muted">Contas em risco</p><p class="num">3</p></div>
      </div>
      <div class="card funnel">
        <h3 style="color:#2d6f63;font-weight:400;font-size:22px;margin:0">Funil de ativação</h3>
        <div class="row"><div class="row-head"><span>Cadastro</span><span>42</span></div><div class="track"><div class="fill" style="width:100%"></div></div></div>
        <div class="row"><div class="row-head"><span>Horários definidos</span><span>31</span></div><div class="track"><div class="fill" style="width:74%"></div></div></div>
        <div class="row"><div class="row-head"><span>Primeiro paciente</span><span>28</span></div><div class="track"><div class="fill" style="width:67%"></div></div></div>
        <div class="row"><div class="row-head"><span>Primeira sessão concluída</span><span>19</span></div><div class="track"><div class="fill" style="width:45%"></div></div></div>
      </div>
    </div>
    <script>
      if (window.innerWidth < 500) document.getElementById("metrics").classList.add("mobile");
    </script>
  </body>
</html>
